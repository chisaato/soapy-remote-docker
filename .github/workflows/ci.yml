name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像(仅验证 Dockerfile,不推送)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
